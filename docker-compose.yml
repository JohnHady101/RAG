version: '3.8'

services:
  app:
    container_name: RAG
    build: .
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    working_dir: /app
    env_file:
      - .env
    environment:
      # Inside Compose the DB is reachable via the service name.
      PGVECTOR_HOST: pgvector
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Since there is no network, you cannot expose ports.
    # The container will run isolated from any network.


  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector_db
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-myuser}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-mypassword}
      POSTGRES_DB: ${PGVECTOR_DB:-vectordb}
      # 1. What ${PGVECTOR_DB:-vectordb} means
      # This is Docker Compose's variable substitution syntax. It tells Docker Compose to do the following:
      # Look for an environment variable named PGVECTOR_DB in your host machine's bash environment (or in a .env file in the same directory as your compose file).
      # If PGVECTOR_DB is not set or is empty on the host, use the default value vectordb.
    ports:
      - "5432:5432"
    # volumes:
    #   - pgvector_data:/var/lib/postgresql/data
    stdin_open: true
    tty: true
    restart: unless-stopped

    # postgresql://myuser:mypassword@pgvector:5432/vectordb if connecting from the dev container





# run with: docker compose up app -d
